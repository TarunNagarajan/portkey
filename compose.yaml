services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portkey
      POSTGRES_USER: portkey
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong database password}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U portkey"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    init: true
    ports: ["127.0.0.1:3001:3001"]
    environment:
      DATABASE_URL: postgresql://portkey:${POSTGRES_PASSWORD}@db:5432/portkey
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin}
      ISSUER_PUBLIC_KEY: ${ISSUER_PUBLIC_KEY:-}
      ALLOW_DEMO_CREDENTIALS: ${ALLOW_DEMO_CREDENTIALS:-false}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
